<body class="imoveis-page">
    <header>
        <nav>
            <div class="logo">
                <span class="logo-text">LB</span>
                <span class="logo-full">Leandro Bomfim</span>
            </div>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="imoveis.html" class="active">Imóveis</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
            <div class="menu-toggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>

    <main>
        <section class="filters fade-in">
            <h2>Filtrar Imóveis</h2>
            <!-- Busca por texto -->
            <div class="search-text-wrap">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="busca-texto" placeholder="Buscar por título, bairro, tipo...">
            </div>
            <div class="filter-container">
                <div class="filter-group fade-in delay-1">
                    <label for="bairro">Bairro:</label>
                    <select id="bairro">
                        <option value="">Todos</option>
                    </select>
                </div>
                <div class="filter-group fade-in delay-2">
                    <label for="quartos">Quartos:</label>
                    <select id="quartos">
                        <option value="">Todos</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4+</option>
                    </select>
                </div>
                <div class="filter-group fade-in delay-3">
                    <label for="preco">Faixa de Preço (R$):</label>
                    <select id="preco">
                        <option value="">Todos</option>
                        <option value="0-600000">Até 600.000</option>
                        <option value="600001-1000000">600.001 – 1.000.000</option>
                        <option value="1000001+">Acima de 1.000.000</option>
                    </select>
                </div>
                <div class="filter-group fade-in delay-4">
                    <label for="tipo">Tipo:</label>
                    <select id="tipo">
                        <option value="">Todos</option>
                        <option value="Apartamento">Apartamento</option>
                        <option value="Casa">Casa</option>
                        <option value="Cobertura">Cobertura</option>
                        <option value="Comercial">Comercial</option>
                    </select>
                </div>
                <div class="filter-group fade-in delay-4">
                    <label for="ordenar">Ordenar por:</label>
                    <select id="ordenar">
                        <option value="destaque">Destaques primeiro</option>
                        <option value="recentes">Mais recentes</option>
                        <option value="menor-preco">Menor preço</option>
                        <option value="maior-preco">Maior preço</option>
                        <option value="maior-area">Maior área</option>
                    </select>
                </div>
            </div>
            <!-- Checkbox mostrar vendidos/alugados -->
            <div class="filter-extra-row">
                <label class="checkbox-label">
                    <input type="checkbox" id="mostrar-vendidos">
                    <span>Mostrar vendidos / alugados</span>
                </label>
            </div>
        </section>

        <!-- Barra de resultados -->
        <div id="results-bar" class="results-bar" style="display:none;">
            <span id="results-count"></span>
            <button id="btn-limpar-filtros" onclick="limparFiltros()" style="display:none;">
                <i class="fas fa-times-circle"></i> Limpar filtros
            </button>
        </div>

        <section class="gallery" id="gallery">
            <!-- Galeria populada pelo JS -->
        </section>
    </main>

    <!-- MODAL SAIBA MAIS -->
    <div class="modal-overlay" id="imovel-modal">
        <div class="modal-container">
            <button class="modal-close" onclick="closeModal()">
                <i class="fas fa-times"></i>
            </button>

            <div class="modal-gallery">
                <div class="modal-main-photo-wrap">
                    <img id="modal-main-photo" src="" alt="Foto principal do imóvel">
                    <button class="modal-nav modal-prev" onclick="prevPhoto()">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <button class="modal-nav modal-next" onclick="nextPhoto()">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                    <div class="modal-photo-counter" id="modal-photo-counter">1 / 4</div>
                </div>
                <div class="modal-thumbs" id="modal-thumbs"></div>
            </div>

            <div class="modal-info">
                <h2 id="modal-title"></h2>
                <div class="modal-tags" id="modal-tags">
                    <span class="modal-tag"><i class="fas fa-map-marker-alt"></i> <span id="modal-bairro"></span></span>
                    <span class="modal-tag"><i class="fas fa-bed"></i> <span id="modal-quartos"></span> quartos</span>
                    <span class="modal-tag"><i class="fas fa-ruler-combined"></i> <span id="modal-area"></span></span>
                </div>
                <p class="modal-preco" id="modal-preco"></p>
                <p class="modal-descricao" id="modal-descricao"></p>
                <div class="modal-cta-group">
                    <a href="https://wa.me/5521981424469" id="modal-whatsapp" class="modal-cta" target="_blank" rel="noopener">
                        <i class="fab fa-whatsapp"></i>
                        <span>Tenho Interesse</span>
                    </a>
                    <a href="contato.html" class="modal-cta modal-cta-contato">
                        <i class="fas fa-address-card"></i>
                        <span>Ver Contatos</span>
                    </a>
                    <button id="modal-share-btn" class="modal-cta modal-cta-share">
                        <i class="fas fa-share-alt"></i>
                        <span>Compartilhar</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

        <p>&copy; 2026 Leandro Imóveis. Todos os direitos reservados.</p>
    </footer>

    <a href="https://wa.me/5521981424469?text=Olá%20Leandro!%20Tenho%20interesse%20em%20imóveis.%20Pode%20me%20ajudar%3F"
       class="whatsapp-float" target="_blank" rel="noopener" aria-label="Falar no WhatsApp">
        <div class="whatsapp-float-inner">
            <i class="fab fa-whatsapp"></i>
            <span class="whatsapp-float-label">Falar com Leandro</span>
        </div>
        <span class="whatsapp-float-pulse"></span>
    </a>

</body>
</html>
